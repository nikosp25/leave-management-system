spring.application.name=leave-management-system

# Database Connection

# Demo credentials are intentionally visible because this is a local student portfolio project.
# Do not reuse these credentials in production or for any real database.
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=cf9
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# IMPORTANT: disable Open Session in View
spring.jpa.open-in-view=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

